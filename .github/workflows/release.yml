# Release automática: ao enviar uma tag vX.Y.Z (ou vX.Y.Z-rc.N), compila o exe e o instalador
# com essa versão e publica a Release no GitHub, usando a seção do CHANGELOG.md como notas.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write # criar a Release e anexar os arquivos

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão a partir da tag
        id: versao
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.]+)?$') { Write-Error "Tag fora do padrão vX.Y.Z[-rc.N]: $tag"; exit 1 }
          "versao=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "base=$($Matches[1])"         >> $env:GITHUB_OUTPUT   # release candidate usa as notas da versão final
          "pre=$([bool]$Matches[2])"    >> $env:GITHUB_OUTPUT

      # Antes de compilar: sem seção no changelog, não há release.
      - name: Notas da release (CHANGELOG.md)
        shell: pwsh
        run: ./scripts/notas-da-release.ps1 -Versao '${{ steps.versao.outputs.base }}' -Saida notas.md

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publica o exe
        run: >
          dotnet publish -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.versao.outputs.versao }}
          -o publish-self-contained

      - name: Gera o instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.versao.outputs.versao }}" instalador.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publica a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = if ('${{ steps.versao.outputs.pre }}' -eq 'True') { '--prerelease' } else { '--latest' }
          gh release create '${{ github.ref_name }}' `
            instalador/YtCortador-Setup.exe publish-self-contained/YtCortador.exe `
            --title 'YtCortador ${{ github.ref_name }}' --notes-file notas.md --verify-tag $extra
